- name: "HTH | Systemd | Assert input variables"
  ansible.utils.validate:
    data: "{{ systemd }}"
    criteria: "{{ lookup('file', 'assertions/systemd-criteria.json') | from_json }}"
    engine: ansible.utils.jsonschema
  run_once: yes
  delegate_to: localhost

- name: "HTH | Systemd | Get systemd version"
  ansible.builtin.command:
    argv: [systemctl, --version]
  register: hth_systemd_version
  changed_when: false
  check_mode: false

- name: "HTH | Systemd | Get systemd major version"
  ansible.builtin.set_fact:
    hth_systemd_major_version:  "{{ hth_systemd_version.stdout | regex_search('^systemd (\\d+)', '\\1') | first | int }}"

- name: "HTH | Systemd | Manage credentials"
  ansible.builtin.include_tasks: credentials/main.yml
  when: systemd.credentials is defined

- name: "HTH | Systemd | Manage units"
  ansible.builtin.include_tasks: units/main.yml
  when: systemd.units is defined

- name: "HTH | Systemd | Manage tmpfiles"
  ansible.builtin.include_tasks: tmpfiles/main.yml
  when: systemd.tmpfiles is defined

- name: "HTH | Systemd | Reload systemd daemon"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - hth_systemd_unit_files_changed is defined
    - hth_systemd_unit_files_changed

- name: "HTH | Systemd | Set unit state"
  ansible.builtin.include_tasks: state.yml
  loop: "{{ systemd.units }}"
  loop_control:
    loop_var: "unit"
  when:
    - systemd.units is defined
