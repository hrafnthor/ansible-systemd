---
- name: Converge
  hosts: all
  become: true
  gather_facts: true
  roles:
  - role: hth.systemd
    vars:
      the_secret_var: "this is the value to encrypt"
      systemd:
        credentials:
          - name: variable_credential
            variable: the_secret_var
          - name: value_credential
            value: "very secret secret"
